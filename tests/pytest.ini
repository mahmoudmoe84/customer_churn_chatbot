[pytest]
# Pytest configuration for agent tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    basic: Basic query tests
    prediction: Prediction capability tests
    comparison: Comparison query tests
    analysis: Deep analysis tests
    context: Context awareness tests
    financial: Financial analysis tests
